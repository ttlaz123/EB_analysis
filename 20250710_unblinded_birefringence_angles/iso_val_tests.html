    <section>
        <h2>Isotropic Birefringence Sanity Checks</h2>
        <figure>
            <img alt="Test Data" id="isotest" src="#" width="750" height="500"
                onerror="javascript:this.src='dne.png'" />
            <figcaption>
                BK18lf sim set, only EB, no foregrounds. Beta_cmb has a spread of about +-0.05 in both configurations.
            </figcaption>

            <script type="text/javascript">
                function pad(num, size) {
                    num = num.toString();
                    while (num.length < size) num = "0" + num;
                    return num;
                }
                const simnums = [];
                for (let i = 0; i < 10; i++) {
                    s = pad(i, 1);

                    simnums[i] = s.concat('|', s);

                }

                pager.link("#isotest", {
                    'Map Sim Num Digit1|digit1': simnums,
                    'Digit2|digit2': simnums,
                    'Digit3|digit3': simnums,

                    'Plot type|plottype2': [
                        'Best Fit EE|_bestfitEE',
                        'Best Fit EB|_bestfitEB',
                        'Best Fit BB|_bestfitBB',
                        'Triangle Plot|_triangle_plot',
                        'Chi squared|_chisqmap',
                        'Summary|_summary'
                    ],
                    'Test|test': [
                        'All angles set to zero|zero',
                    ],
                    'Configuration|config': [
                        'No foregrounds, 150 and 95 EB only|15095',
                        'No foregrounds, all 4 angles, EB only|_all',

                    ],

                },

                    function (params) {
                        let dirbase = '/liuto';
                        let dirpath = dirbase + '/iso_val_chains/';



                        let foldername = params.test + params.config + '/';

                        let sim_id = 'sim' + params.digit1 + params.digit2 + params.digit3;
                        if (params.plottype2 == '_summary') {
                            sim_id = 'sim1';
                        }
                        let file = sim_id + params.plottype2;
                        let name = dirpath + foldername + file + '.png';

                        console.log(name);
                        return name;
                    });

                pager.setparams({
                    'digit1': '0',
                    'digit2': '0',
                    'digit3': '1',
                    'plottype2': '_summary',
                    'test': 'zero',
                    'config': '_all',
                });
            </script>
        </figure>

        <h2>2D Loglikelihood Plots</h2>
        <figure>
            <img alt="Test Data" id="loglike" src="#" width="750" height="500"
                onerror="javascript:this.src='dne.png'" />
            <figcaption>
                Configuration options (<code>config9</code>):
                <ul>
                    <li><b>All other angles fixed, BK18 + Planck Data</b>:
                        All polarization rotation angles except the one being scanned
                        are fixed to their best-fit values. Uses both BK18 and Planck data.</li>
                    <li><b>EB Only, no foregrounds, only one dataset</b>:
                        Uses only the EB spectrum, excludes foreground modeling,
                        and includes only a single dataset to highlight parameter degeneracies
                        without foregrounds.</li>
                    <li><b>EE+BB+EB, with foregrounds, only one dataset</b> :
                        Fits all three spectra (EE, BB, EB) including foregrounds,
                        but using only one dataset at a time. We see slight constraining power in higher frequencies.
                    </li>
                     <li><b>EE+BB+EB, with foregrounds, only one dataset, normalized</b> :
                        Same as above, but the loglikelihood color scale 
                        is set at min chi2 for the lower end, and minchi2 + 2 for the higher end.
                        We see roughly what the contours for 2 sigma would be for each dataset.
                    </li>
                </ul>
            </figcaption>

            <script type="text/javascript">


                pager.link("#loglike", {


                    'Angle|freq': [
                        'alpha_BK18_150|alpha_BK18_150',
                        'alpha_BK18_K95|alpha_BK18_K95',
                        'alpha_BK18_B95lf|alpha_BK18_B95e',
                        'alpha_BK18_220|alpha_BK18_220',
                        'alpha_P217e|alpha_P217e',
                        'alpha_P353e|alpha_P353e',
                    ],
                    'Configureation|config9': [
                        'All other angles fixed, BK18 + Planck Data|fixed_else',
                        'EB Only, no foregrounds, only one dataset|degen',
                        'EE+BB+EB, with foregrounds, only one dataset|only_one',
                        'EE+BB+EB, with foregrounds, only one dataset, normalized|normalized'
                    ]

                },

                    function (params) {
                        let dirbase = '/liuto/home/GitHub/EB_analysis';
                        let dirpath = dirbase + '/loglikelihood_2dmaps/';



                        let foldername = params.config9 + '/';

                        let file = '2dlikemap_' + params.freq + '_alpha_CMB';
                        let name = dirpath + foldername + file + '.png';

                        console.log(name);
                        return name;
                    });

                pager.setparams({

                    'freq': 'alpha_BK18_220',
                    'config9': 'fixed_else',
                });
            </script>
        </figure>
